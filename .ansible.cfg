[defaults]
remote_tmp = /tmp/ansible-${USER}
stdout_callback = ansible.builtin.default
; YAML results render multi-line stdout/stderr as readable blocks
callback_result_format = yaml
callback_format_pretty = true
; hide the many tasks skipped by `when:` conditions
display_skipped_hosts = false
show_task_path_on_failure = true
; profile_tasks: a summary of the slowest tasks at the end
; local.datalab.deployment_ledger records each datalab deployment run (see ~/repos/datalab/deployments-meta);
; loaded as a collection, as ansible-navigator/runner overrides callback_plugins
callbacks_enabled = ansible.posix.profile_tasks, local.datalab.deployment_ledger
; deprecations are almost always from collection internals, not something to act on
deprecation_warnings = false

[callback_profile_tasks]
; no per-task timestamps (they are also printed for hidden skipped tasks); just the slowest tasks at the end
summary_only = true
task_output_limit = 10

[persistent_connection]
command_timeout = 5
