# hyprlock — Wayland screen locker driving PAM async so fingerprint +
# password both work without blocking each other.

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
    ignore_empty_input = true
}

auth {
    fingerprint:enabled = true
    fingerprint:ready_message = $FPRINTPROMPT
    fingerprint:present_message = Scanning…
    fingerprint:retry_delay = 250
    pam:module = hyprlock
}

background {
    monitor =
    path    = ~/.local/share/wallpapers/navajo.jpg
    blur_passes = 3
    blur_size   = 8
    contrast    = 0.9
    brightness  = 0.6
}

# Centered date
label {
    monitor =
    text    = cmd[update:1000] date "+%H:%M"
    color   = rgba(213, 196, 161, 1.0)
    font_size   = 96
    font_family = Iosevka Aile
    position    = 0, 100
    halign      = center
    valign      = center
}

label {
    monitor =
    text    = cmd[update:60000] date "+%A, %d %B"
    color   = rgba(213, 196, 161, 0.8)
    font_size   = 22
    font_family = Iosevka Aile
    position    = 0, 30
    halign      = center
    valign      = center
}

# Password input
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(186, 139, 175, 0.6)
    inner_color = rgba(22, 24, 26, 0.85)
    font_color  = rgba(213, 196, 161, 1.0)
    fade_on_empty = false
    placeholder_text = <i>password or fingerprint</i>
    fail_color = rgba(251, 73, 52, 0.9)
    fail_text  = <i>$FAIL ($ATTEMPTS)</i>
    hide_input = false
    rounding = 6
    check_color = rgba(250, 189, 47, 1.0)
    position = 0, -80
    halign   = center
    valign   = center
}
