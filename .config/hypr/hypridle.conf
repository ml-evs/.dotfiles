general {
    lock_cmd = pidof hyprlock || hyprlock                                     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                  # lock before suspend.
    after_sleep_cmd = swaymsg 'output * power on'                              # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 360                                 # 6min, 1min after the lock
    on-timeout = swaymsg 'output * power off'                 # screen off when timeout has passed
    on-resume = swaymsg 'output * power on'; brightnessctl -r  # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 7200                                # 2h
    on-timeout = ~/.dotfiles/scripts/idle-suspend 7200  # suspend once SSH ptys are also 2h idle
    on-resume = pkill -x idle-suspend             # local input came back first
}
