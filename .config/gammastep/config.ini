; gammastep — Wayland successor to redshift. Mirrors the old
; ~/.config/redshift.conf settings, but uses the wlroots gamma-control
; protocol instead of X11 randr.

[general]
; Day/night screen temperatures (Kelvin).
temp-day=6000
temp-night=3500

; Smoothly fade between temperatures (1 = gradual, 0 = instant).
fade=1

; Screen gamma. redshift had gamma=0.8 with gamma-day=1.1.
gamma=0.8
gamma-day=1.1

; Manual location (redshift used geoclue-free manual coords).
location-provider=manual

; Wayland gamma control (wlr-gamma-control-unstable-v1). Was 'randr' on X11.
adjustment-method=wayland

[manual]
lat=48.1
lon=11.6
